<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Matcher - CareerAI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="jobs-style.css">
    <link rel="icon" type="image/png" href="logoo.png">
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar">
        <a href="home.html" class="logo">
            <img src="logoo.png" alt="CareerAI Logo" class="logo-image">
        </a>

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="jobs.html" class="active">Job Matcher</a>
            <a href="profile.html">Profile</a>
        </div>

        <div class="nav-buttons">
            <a href="dashboard.html" class="back-btn" style="color: white; font-weight: 600; text-decoration: none; padding: 7px 16px; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; font-size: 14px;">← Back to Dashboard</a>
        </div>
    </nav>

    <main style="max-width: 1100px; margin: 30px auto; padding: 0 20px;">
        <h1 style="text-align: center; margin-bottom: 24px; color: #681313;">GET MATCHED WITH THE PERFECT OPPORTUNITIES FOR YOU</h1>

        <div id="jobsMessage" style="text-align: center; font-size: 16px; margin: 20px 0; color: #555;">Loading jobs...</div>

        <div id="jobsContainer"></div>
    </main>

    <script src="api.js?v=20261126v2"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (!requireAuth()) return;
            loadJobs();
        });

        const jobsMessage = document.getElementById("jobsMessage");
        const jobsContainer = document.getElementById("jobsContainer");

        async function loadJobs() {
            try {
                const jobs = await apiGetJobs();

                jobsMessage.textContent = "";

                if (!jobs || jobs.length === 0) {
                    jobsMessage.textContent = "No jobs currently available.";
                    return;
                }

                jobs.forEach(job => {
                    const jobDiv = document.createElement("div");
                    jobDiv.className = "job-card";
                    jobDiv.style.marginBottom = "24px";
                    jobDiv.style.padding = "20px";
                    jobDiv.style.background = "#fff";
                    jobDiv.style.borderRadius = "12px";
                    jobDiv.style.boxShadow = "0 4px 15px rgba(0,0,0,0.06)";

                    jobDiv.innerHTML = `
                        <h2 style="color: #681313; margin-top: 0;">${escapeHtml(job.job_title)}</h2>
                        <p style="font-weight: 600; color: #444;">${escapeHtml(job.company || "")} &bull; ${escapeHtml(job.location || "Remote / Various")}</p>

                        <p style="line-height: 1.6; color: #333;">
                            ${escapeHtml(job.job_description)}
                        </p>

                        <p>
                            <strong>Required Skills:</strong>
                            ${escapeHtml((job["required skills"] || []).join(", ") || "General Skills")}
                        </p>

                        <p>
                            <strong>Salary:</strong>
                            ${escapeHtml(job.salary || "Not specified")}
                        </p>

                        <div style="display: flex; gap: 10px; margin-top: 15px;">
                            <button type="button" class="match-btn" style="background: #681313; color: white; border: none; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-weight: 600;">
                                Match Me
                            </button>

                            <button type="button" class="apply-btn" style="background: #157347; color: white; border: none; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-weight: 600;">
                                Apply
                            </button>
                        </div>

                        <div class="match-result" style="margin-top: 15px;"></div>
                    `;

                    const matchButton = jobDiv.querySelector(".match-btn");
                    const applyButton = jobDiv.querySelector(".apply-btn");
                    const resultBox = jobDiv.querySelector(".match-result");

                    matchButton.addEventListener("click", () => {
                        matchJob(job, matchButton, resultBox);
                    });

                    applyButton.addEventListener("click", () => {
                        applyJob(job, applyButton);
                    });

                    jobsContainer.appendChild(jobDiv);
                });

            } catch (error) {
                console.error(error);
                jobsMessage.textContent = "Could not load jobs: " + error.message;
            }
        }

        async function matchJob(job, button, resultBox) {
            if (!getToken()) {
                alert("Please log in first.");
                window.location.href = "login.html";
                return;
            }

            button.disabled = true;
            button.textContent = "Matching with AI...";
            resultBox.innerHTML = "<p style='color:#666;'>Analyzing your resume against this job posting with Gemini AI...</p>";

            try {
                // Check if candidate has a resume
                const resume = await apiGetResume();
                if (!resume || !resume.content_json) {
                    resultBox.innerHTML = "<p style='color:#c62828;'><strong>No resume found.</strong> Please upload your resume in the <a href='resume.html'>Resume Optimizer</a> first.</p>";
                    button.disabled = false;
                    button.textContent = "Match Me";
                    return;
                }

                const data = await apiMatchJob(job.job_title, job.job_description || "");

                resultBox.innerHTML = `
                    <div style="background: #fdf8f5; border-left: 4px solid #681313; padding: 15px; border-radius: 8px; margin-top: 10px;">
                        <h3 style="margin-top: 0; color: #681313;">AI Match Results</h3>
                        <p><strong>Match Score:</strong> <span style="font-size: 18px; font-weight: 700; color: #681313;">${escapeHtml(data.match_score)}%</span></p>
                        <p><strong>Recommendation:</strong> <span style="text-transform: capitalize; font-weight: 600;">${escapeHtml(data.recommendation || "Not available").replaceAll("_", " ")}</span></p>
                        <p><strong>Summary:</strong> ${escapeHtml(data.summary || "No summary provided.")}</p>
                        <p><strong>Matched Skills:</strong></p>
                        ${renderList(data.matched_skills)}
                        <p><strong>Missing Skills / Recommendations:</strong></p>
                        ${renderList(data.missing_skills)}
                        <p><strong>Key Strengths:</strong></p>
                        ${renderList(data.strengths)}
                        <p><strong>Points of Concern:</strong></p>
                        ${renderList(data.concerns)}
                    </div>
                `;

            } catch (error) {
                resultBox.innerHTML = `<p style="color: #c62828;">${escapeHtml(error.message)}</p>`;
            } finally {
                button.disabled = false;
                button.textContent = "Match Me";
            }
        }

        async function applyJob(job, button) {
            const url = job.job_url;

            // Record application in backend
            try {
                await apiApplyJob(job.job_title, job.company || "CareerAI Opportunity", url || "");
            } catch (err) {
                console.warn("Application recording notice:", err.message);
            }

            if (!url || !/^https?:\/\//i.test(url)) {
                alert("Application noted! However, direct external URL is unavailable.");
                return;
            }

            window.open(url, "_blank", "noopener,noreferrer");
        }

        function renderList(items) {
            if (!Array.isArray(items) || items.length === 0) {
                return "<p style='color: #777; margin: 4px 0 10px;'>None reported.</p>";
            }

            return "<ul style='margin: 4px 0 12px; padding-left: 20px;'>" + items.map(item =>
                "<li>" + escapeHtml(
                    typeof item === "object" && item !== null
                        ? JSON.stringify(item)
                        : item
                ) + "</li>"
            ).join("") + "</ul>";
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }
    </script>

</body>
</html>
